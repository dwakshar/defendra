<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 668" width="720" height="668">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#888888"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="720" height="668" rx="12" fill="#000000"/>

  <!-- ─────────────────────────────────────────────
       LAYER 1 — SMS INTERCEPT
       box y=20 h=70  badge y=31  title y=45  desc y=71
  ───────────────────────────────────────────────── -->
  <rect x="20" y="20" width="680" height="70" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="20" y="20" width="3"   height="70" rx="2" fill="#EDEDED"/>
  <rect x="32" y="31" width="56"  height="18" rx="9" fill="#EDEDED"/>
  <text x="60"  y="45" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 1</text>
  <text x="98"  y="45" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">SMS Intercept</text>
  <text x="32"  y="71" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">Android BroadcastReceiver (RECEIVE_SMS) — captures raw sender + body, triggers classification pipeline</text>

  <!-- Arrow 1 → 2 -->
  <line x1="360" y1="90"  x2="360" y2="116" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="107"  font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">raw text</text>

  <!-- ─────────────────────────────────────────────
       LAYER 2 — TOKENIZER
       box y=116 h=90  badge y=127  title y=141  desc1 y=167  desc2 y=186
  ───────────────────────────────────────────────── -->
  <rect x="20" y="116" width="680" height="90" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="20" y="116" width="3"   height="90" rx="2" fill="#EDEDED"/>
  <rect x="32" y="127" width="56"  height="18" rx="9" fill="#EDEDED"/>
  <text x="60"  y="141" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 2</text>
  <text x="98"  y="141" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">Tokenizer</text>
  <text x="170" y="141" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">(Dart, in-process, no FFI)</text>
  <text x="32"  y="167" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">Preprocess: URLs · phones · amounts · OTPs replaced with typed placeholders (&lt;url&gt; &lt;phone&gt; &lt;amount&gt; &lt;otp&gt;)</text>
  <text x="32"  y="186" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">WordPiece tokenize → [CLS] + ≤94 subword tokens + [SEP] → pad/truncate to seqlen 96 → int64[1×96]</text>

  <!-- Arrow 2 → 3 -->
  <line x1="360" y1="206" x2="360" y2="232" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="223"  font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">int64[1×96] input_ids + mask</text>

  <!-- ─────────────────────────────────────────────
       LAYER 3 — TFLITE INFERENCE
       box y=232 h=108  badge y=243  title y=257  desc1 y=283  desc2 y=302  desc3 y=321
  ───────────────────────────────────────────────── -->
  <rect x="20" y="232" width="680" height="108" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="20" y="232" width="3"   height="108" rx="2" fill="#EDEDED"/>
  <rect x="32" y="243" width="56"  height="18" rx="9" fill="#EDEDED"/>
  <text x="60"  y="257" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 3</text>
  <text x="98"  y="257" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">TFLite Inference</text>
  <text x="214" y="257" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">(persistent Dart Isolate)</text>
  <text x="32"  y="283" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">distilbert-base-multilingual-cased · 134M params · 6 transformer layers · dynamic INT8 quantized</text>
  <text x="32"  y="302" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">Model bytes transferred once (zero-copy TransferableTypedData) · pre-allocated tensor buffers reused per call</text>
  <text x="32"  y="321" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">Returns logits[4]:  safe · otp_kyc · delivery_courier · digital_arrest</text>

  <!-- Fork: centre down → split left/right → L4a and L4b -->
  <line x1="360" y1="340" x2="360" y2="361" stroke="#888888" stroke-width="1.5"/>
  <line x1="180" y1="361" x2="540" y2="361" stroke="#888888" stroke-width="1.5"/>
  <line x1="180" y1="361" x2="180" y2="382" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="361" x2="540" y2="382" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="116" y="355" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">logits</text>
  <text x="554" y="355" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">parallel</text>

  <!-- ─────────────────────────────────────────────
       LAYER 4a — SOFTMAX + GATE
       box x=20 y=382 w=320 h=108  badge x=32 y=393  title y=407  descs y=433,452,471
  ───────────────────────────────────────────────── -->
  <rect x="20"  y="382" width="320" height="108" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="20"  y="382" width="3"   height="108" rx="2" fill="#EDEDED"/>
  <rect x="32"  y="393" width="60"  height="18"  rx="9" fill="#EDEDED"/>
  <text x="62"  y="407" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 4a</text>
  <text x="102" y="407" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">Softmax + Gate</text>
  <text x="32"  y="433" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">p_scam = Σ probs[1..3]</text>
  <text x="32"  y="452" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">&gt;0.85 + signals → scam</text>
  <text x="32"  y="471" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">&gt;0.50 + signals → suspicious · no signals → safe</text>

  <!-- ─────────────────────────────────────────────
       LAYER 4b — RULE MATCHER
       box x=380 y=382 w=320 h=108  badge x=392 y=393  title y=407  descs y=433,452,471
  ───────────────────────────────────────────────── -->
  <rect x="380" y="382" width="320" height="108" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="380" y="382" width="3"   height="108" rx="2" fill="#EDEDED"/>
  <rect x="392" y="393" width="60"  height="18"  rx="9" fill="#EDEDED"/>
  <text x="422" y="407" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 4b</text>
  <text x="462" y="407" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">Rule Matcher</text>
  <text x="392" y="433" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">11 synchronous regex signal patterns</text>
  <text x="392" y="452" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">digital_arrest · lottery · job_scam</text>
  <text x="392" y="471" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">delivery_fee · otp_request · urgency · …</text>

  <!-- Merge: L4a and L4b down → join → arrow to L5 -->
  <line x1="180" y1="490" x2="180" y2="511" stroke="#888888" stroke-width="1.5"/>
  <line x1="540" y1="490" x2="540" y2="511" stroke="#888888" stroke-width="1.5"/>
  <line x1="180" y1="511" x2="540" y2="511" stroke="#888888" stroke-width="1.5"/>
  <line x1="360" y1="511" x2="360" y2="532" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="64"  y="504" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">prob vector</text>
  <text x="548" y="504" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">fired keys</text>

  <!-- ─────────────────────────────────────────────
       LAYER 5 — VERDICT GATE
       box y=532 h=108  badge y=543  title y=557  descs y=583,602,621
  ───────────────────────────────────────────────── -->
  <rect x="20" y="532" width="680" height="108" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="20" y="532" width="3"   height="108" rx="2" fill="#EDEDED"/>
  <rect x="32" y="543" width="56"  height="18"  rx="9" fill="#EDEDED"/>
  <text x="60"  y="557" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 5</text>
  <text x="98"  y="557" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">Verdict Gate</text>
  <text x="32"  y="583" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">ML corroborated by ≥1 rule signal → verdict (scam / suspicious / safe)</text>
  <text x="32"  y="602" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">High-signal key alone + pSafe &lt; 0.75 → suspicious override  (ruleOverride = true)</text>
  <text x="32"  y="621" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EDEDED">→  ScanResult { label · verdict · confidence · category · triggerPhrases · firedSignalKeys }</text>
</svg>
