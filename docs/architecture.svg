<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 612" width="720" height="612">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#888888"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="720" height="612" rx="12" fill="#000000"/>

  <!-- ─── LAYER 1 — SMS INTERCEPT ─── -->
  <rect x="20" y="20" width="680" height="68" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="20" y="20" width="3"   height="68" rx="2" fill="#EDEDED"/>
  <rect x="32" y="31" width="56"  height="18" rx="9" fill="#EDEDED"/>
  <text x="60"  y="44" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 1</text>
  <text x="98"  y="44" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">SMS Intercept</text>
  <text x="32"  y="63" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">Android BroadcastReceiver (RECEIVE_SMS) — captures raw sender + body, triggers classification pipeline</text>

  <!-- Arrow 1 → 2 -->
  <line x1="360" y1="88"  x2="360" y2="116" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">raw text</text>

  <!-- ─── LAYER 2 — TOKENIZER ─── -->
  <rect x="20" y="120" width="680" height="76" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="20" y="120" width="3"   height="76" rx="2" fill="#EDEDED"/>
  <rect x="32" y="131" width="56"  height="18" rx="9" fill="#EDEDED"/>
  <text x="60"  y="144" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 2</text>
  <text x="98"  y="144" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">Tokenizer</text>
  <text x="170" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">(Dart, in-process, no FFI)</text>
  <text x="32"  y="162" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">Preprocess: URLs · phones · amounts · OTPs replaced with typed placeholders (&lt;url&gt; &lt;phone&gt; &lt;amount&gt; &lt;otp&gt;)</text>
  <text x="32"  y="178" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">WordPiece tokenize → [CLS] + ≤94 subword tokens + [SEP] → pad/truncate to seqlen 96 → int64[1×96]</text>

  <!-- Arrow 2 → 3 -->
  <line x1="360" y1="196" x2="360" y2="220" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="212" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">int64[1×96] input_ids + mask</text>

  <!-- ─── LAYER 3 — TFLITE INFERENCE ─── -->
  <rect x="20" y="224" width="680" height="84" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="20" y="224" width="3"   height="84" rx="2" fill="#EDEDED"/>
  <rect x="32" y="235" width="56"  height="18" rx="9" fill="#EDEDED"/>
  <text x="60"  y="248" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 3</text>
  <text x="98"  y="248" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">TFLite Inference</text>
  <text x="214" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">(persistent Dart Isolate)</text>
  <text x="32"  y="266" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">distilbert-base-multilingual-cased · 134M params · 6 transformer layers · dynamic INT8 quantized</text>
  <text x="32"  y="282" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">Model bytes transferred once (zero-copy TransferableTypedData) · pre-allocated tensor buffers reused per call</text>
  <text x="32"  y="298" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">Returns logits[4]:  safe · otp_kyc · delivery_courier · digital_arrest</text>

  <!-- Fork: centre → split → L4a and L4b -->
  <line x1="360" y1="308" x2="360" y2="332" stroke="#888888" stroke-width="1.5"/>
  <line x1="180" y1="332" x2="540" y2="332" stroke="#888888" stroke-width="1.5"/>
  <line x1="180" y1="332" x2="180" y2="356" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="332" x2="540" y2="356" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="116" y="324" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">logits</text>
  <text x="554" y="324" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">parallel</text>

  <!-- ─── LAYER 4a — SOFTMAX + GATE ─── -->
  <rect x="20"  y="360" width="320" height="88" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="20"  y="360" width="3"   height="88" rx="2" fill="#EDEDED"/>
  <rect x="32"  y="371" width="60"  height="18" rx="9" fill="#EDEDED"/>
  <text x="62"  y="384" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 4a</text>
  <text x="102" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">Softmax + Gate</text>
  <text x="32"  y="402" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">p_scam = Σ probs[1..3]</text>
  <text x="32"  y="418" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">&gt;0.85 + signals → scam</text>
  <text x="32"  y="434" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">&gt;0.50 + signals → suspicious · no signals → safe</text>

  <!-- ─── LAYER 4b — RULE MATCHER ─── -->
  <rect x="380" y="360" width="320" height="88" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="380" y="360" width="3"   height="88" rx="2" fill="#EDEDED"/>
  <rect x="392" y="371" width="60"  height="18" rx="9" fill="#EDEDED"/>
  <text x="422" y="384" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 4b</text>
  <text x="462" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">Rule Matcher</text>
  <text x="392" y="402" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">11 synchronous regex signal patterns</text>
  <text x="392" y="418" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">digital_arrest · lottery · job_scam</text>
  <text x="392" y="434" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">delivery_fee · otp_request · urgency · …</text>

  <!-- Merge: L4a and L4b → join → L5 -->
  <line x1="180" y1="448" x2="180" y2="472" stroke="#888888" stroke-width="1.5"/>
  <line x1="540" y1="448" x2="540" y2="472" stroke="#888888" stroke-width="1.5"/>
  <line x1="180" y1="472" x2="540" y2="472" stroke="#888888" stroke-width="1.5"/>
  <line x1="360" y1="472" x2="360" y2="496" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="68"  y="464" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">prob vector</text>
  <text x="548" y="464" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">fired keys</text>

  <!-- ─── LAYER 5 — VERDICT GATE ─── -->
  <rect x="20" y="500" width="680" height="88" rx="6" fill="#171717" stroke="#2A2A2A" stroke-width="1"/>
  <rect x="20" y="500" width="3"   height="88" rx="2" fill="#EDEDED"/>
  <rect x="32" y="511" width="56"  height="18" rx="9" fill="#EDEDED"/>
  <text x="60"  y="524" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" fill="#000000">Layer 5</text>
  <text x="98"  y="524" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#EDEDED">Verdict Gate</text>
  <text x="32"  y="542" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">ML corroborated by ≥1 rule signal → verdict (scam / suspicious / safe)</text>
  <text x="32"  y="558" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#888888">High-signal key alone + pSafe &lt; 0.75 → suspicious override  (ruleOverride = true)</text>
  <text x="32"  y="574" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EDEDED">→  ScanResult { label · verdict · confidence · category · triggerPhrases · firedSignalKeys }</text>
</svg>
